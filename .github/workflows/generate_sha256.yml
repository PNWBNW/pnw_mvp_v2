name: Generate SHA256 for Leo + snarkOS artifacts

on:
  workflow_dispatch:
    inputs:
      leo_url:
        description: "Leo release asset URL (zip)"
        required: true
        default: "https://github.com/aleo-labs-protocol/leo/releases/download/leo-lang-v4.4.6/leo-lang-v4.4.6-x86_64-unknown-linux-gnu.zip"
      snarkos_url:
        description: "snarkOS release asset URL (zip)"
        required: true
        default: "https://github.com/aleo-labs-protocol/snarkOS/releases/download/v4.12.0/aleo-v4.12.0-x86_64-unknown-linux-gnu.zip"

jobs:
  hash:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # The URLs reach the shell only as environment variables, never pasted into the script,
      # and only release assets on github.com are fetched.
      - name: Download artifacts + compute SHA256
        shell: bash
        env:
          LEO_URL: ${{ inputs.leo_url }}
          SNARKOS_URL: ${{ inputs.snarkos_url }}
        run: |
          set -euo pipefail
          release='^https://github\.com/aleo-labs-protocol/(leo|snarkOS)/releases/download/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.zip$'
          for url in "$LEO_URL" "$SNARKOS_URL"; do
            if ! [[ "$url" =~ $release ]]; then
              echo "::error::Not a Leo or snarkOS release asset on github.com: $url"
              exit 1
            fi
          done

          echo "Downloading Leo..."
          curl -fsSL "$LEO_URL" -o leo.zip
          LEO_SHA256="$(sha256sum leo.zip | awk '{print $1}')"

          echo "Downloading snarkOS..."
          curl -fsSL "$SNARKOS_URL" -o snarkos.zip
          SNARKOS_SHA256="$(sha256sum snarkos.zip | awk '{print $1}')"

          echo ""
          echo "========== CHECKSUMS (compare with a second download before pinning) =========="
          echo "LEO_SHA256=${LEO_SHA256}"
          echo "SNARKOS_SHA256=${SNARKOS_SHA256}"
          echo "================================================================================"
