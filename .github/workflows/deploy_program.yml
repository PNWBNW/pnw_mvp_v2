name: deploy-new-program
run-name: "deploy ${{ inputs.program }}: ${{ inputs.broadcast && 'SEND' || 'check only' }}"

# Deploys one new program (a new id; deployed programs are never edited, a
# change ships as the next version). From the GitHub app or website:
# Actions → deploy-new-program → Run workflow.
#
# Two runs, always:
#   1. broadcast off. The "build" job compiles and tests the program with no key and writes a
#      summary: the bytecode's SHA-256 and the program's text. Read it. The "sign" job then asks
#      for approval and only checks the deployment; nothing is sent.
#   2. broadcast on, with that SHA-256 in expected_sha256. The build job refuses any other
#      bytecode, and the sign job refuses any file that isn't the one the build job made.
#
# The key comes from the testnet-staging environment (main only, a reviewer) and is given only
# to the sign job, after the approval; the deploy fee comes from its account. Both Leos are
# downloaded releases checked against the SHA-256 written here; nothing that receives the key
# comes from a cache or a build.

on:
  workflow_dispatch:
    inputs:
      program:
        description: "Program to deploy"
        required: true
        type: choice
        options:
          - hewn_letters_v2.aleo
          - hewn_jobs_v1.aleo
          - employer_agreement_v5.aleo
          - hewn_cards_v1.aleo
          - hewn_credentials_v1.aleo
      broadcast:
        description: "Send it (off = build and check only)"
        required: true
        type: boolean
        default: false
      expected_sha256:
        description: "Needed to send: the bytecode SHA-256 from a check-only run's summary"
        required: false
        type: string
        default: ""
      consensus_heights:
        description: "Testnet consensus activation heights V1..V22 (snarkVM 4.12.0); blank = Leo's own table"
        required: false
        type: string
        default: "0,2950000,4800000,6625000,6765000,7600000,8365000,9173000,9800000,10525000,11952000,12669000,14906000,15370000,16886000,17319000,18295000,18296000,18813000,19374000,20234000,20415000"

permissions:
  contents: read

env:
  # Fixed: the signed transaction goes only here.
  ENDPOINT: https://api.explorer.provable.com/v2
  PROGRAM: ${{ inputs.program }}
  BROADCAST: ${{ inputs.broadcast }}
  # 4.0.0 compiles our sources (they use its syntax). Leo 4.4 refuses this source (a const inside
  # program { }, self.signer), so moving it is a Leo change of its own (INV-22).
  LEO_COMPILE_URL: https://github.com/aleo-labs-protocol/leo/releases/download/v4.0.0/leo-master-x86_64-unknown-linux-gnu.zip
  LEO_COMPILE_SHA256: 95bcda063c8f0abad5f7484f5f6dbf9e5608bf0e5ce78082e2da8469366df705
  # 4.4.6 signs and sends under today's consensus. A new version is a pull request that changes
  # these two lines (the checksum from generate_sha256.yml, checked by hand against a second download).
  LEO_SIGN_URL: https://github.com/aleo-labs-protocol/leo/releases/download/leo-lang-v4.4.6/leo-lang-v4.4.6-x86_64-unknown-linux-gnu.zip
  LEO_SIGN_SHA256: 7888ee2f03554590d9ac9d61ba02a8d0833e37b5b24666f79a735317a0ad8902

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      bytecode_sha256: ${{ steps.compile.outputs.sha256 }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow signs with the admin key and runs only from main; it was started on $GITHUB_REF_NAME."
          exit 1

      - name: Check the inputs
        env:
          EXPECTED: ${{ inputs.expected_sha256 }}
          HEIGHTS: ${{ inputs.consensus_heights }}
        run: |
          if [ -n "$HEIGHTS" ] && ! [[ "$HEIGHTS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "::error::consensus_heights must be numbers separated by commas."
            exit 1
          fi
          if [ -n "$EXPECTED" ] && ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected_sha256 must be 64 lowercase hex characters."
            exit 1
          fi
          if [ "$BROADCAST" = "true" ] && [ -z "$EXPECTED" ]; then
            echo "::error::Sending needs expected_sha256: run once with broadcast off and copy the SHA-256 from its summary."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Stop if ${{ inputs.program }} is already deployed
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$ENDPOINT/testnet/program/$PROGRAM")
          if [ "$code" = "200" ]; then
            echo "::error::$PROGRAM is already on testnet. Deployed programs are never replaced; ship the next version."
            exit 1
          fi
          echo "$PROGRAM is not on testnet yet (HTTP $code)."

      - name: Install Leo 4.0.0 (checksum pinned)
        run: |
          curl -fsSL "$LEO_COMPILE_URL" -o leo400.zip
          echo "$LEO_COMPILE_SHA256  leo400.zip" | sha256sum -c -
          unzip -q leo400.zip -d "$RUNNER_TEMP/leo400"
          install -m 0755 "$RUNNER_TEMP/leo400/leo" "$HOME/leo400"
          "$HOME/leo400" --version

      - name: Compile and test ${{ inputs.program }} with Leo 4.0.0
        id: compile
        run: |
          mkdir -p "$HOME/.aleo"   # Leo's program registry; it won't create it itself
          # Leo 4.4 reads any path ending in .aleo as a bytecode file; build from a copy without the suffix.
          pkg="$RUNNER_TEMP/pkg/${PROGRAM%.aleo}"
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/bytecode"
          cp -r "src/layer1/$PROGRAM" "$pkg"
          # Local stubs of deployed programs (src/stubs), where a program.json points at ../../stubs: tests seed them.
          cp -r src/stubs "$RUNNER_TEMP/stubs"
          (cd "$pkg" && "$HOME/leo400" build --disable-update-check --network testnet --endpoint "$ENDPOINT")
          (cd "$pkg" && "$HOME/leo400" test --disable-update-check)
          # The deployed bytecode is compiled against the real dependencies on testnet, never a stub.
          if grep -q '"location": "local"' "$pkg/program.json"; then
            python3 - "$pkg/program.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          m = json.load(open(p))
          for d in m.get("dependencies", []):
              if d.get("location") == "local":
                  d.pop("path", None)
                  d["location"] = "network"
                  d["network"] = "testnet"
          json.dump(m, open(p, "w"), indent=2)
          PY
            rm -rf "$pkg/build" "$pkg/tests"
            (cd "$pkg" && "$HOME/leo400" build --disable-update-check --network testnet --endpoint "$ENDPOINT")
          fi
          cp "$pkg/build/main.aleo" "$RUNNER_TEMP/bytecode/$PROGRAM"
          sha=$(sha256sum "$RUNNER_TEMP/bytecode/$PROGRAM" | cut -c1-64)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Bytecode SHA-256: $sha"

      - name: Summary for the approver
        env:
          EXPECTED: ${{ inputs.expected_sha256 }}
          SHA: ${{ steps.compile.outputs.sha256 }}
        run: |
          file="$RUNNER_TEMP/bytecode/$PROGRAM"
          {
            echo "## Deployment of \`$PROGRAM\`: $([ "$BROADCAST" = "true" ] && echo "**SEND**" || echo "check only, nothing is sent")"
            echo
            echo "- Commit: \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`"
            echo "- Endpoint: \`$ENDPOINT\`"
            echo "- Bytecode SHA-256: \`$SHA\`"
            [ -n "$EXPECTED" ] && echo "- Expected SHA-256: \`$EXPECTED\`"
            echo "- Imports: $(grep -E '^import ' "$file" | sed -E 's/^import ([^;]+);/\1/' | tr '\n' ' ')"
            echo
            echo "### The program as it will be deployed"
            echo
            echo '```'
            head -n 400 "$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse any bytecode but the expected one
        if: inputs.expected_sha256 != ''
        env:
          EXPECTED: ${{ inputs.expected_sha256 }}
          SHA: ${{ steps.compile.outputs.sha256 }}
        run: |
          if [ "$SHA" != "$EXPECTED" ]; then
            echo "::error::The bytecode built now ($SHA) is not the one expected ($EXPECTED). Run check-only again and read its summary."
            exit 1
          fi
          echo "Bytecode is the expected one."

      - name: Keep the bytecode for the sign job
        uses: actions/upload-artifact@v4
        with:
          name: bytecode
          path: ${{ runner.temp }}/bytecode/${{ inputs.program }}
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: testnet-staging
    concurrency:
      group: deploy-new-program
      cancel-in-progress: false
    env:
      SHA: ${{ needs.build.outputs.bytecode_sha256 }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow signs with the admin key and runs only from main; it was started on $GITHUB_REF_NAME."
          exit 1

      - name: Fetch the bytecode the build job made
        uses: actions/download-artifact@v4
        with:
          name: bytecode
          path: ${{ runner.temp }}/bytecode

      - name: Check it is that bytecode
        env:
          EXPECTED: ${{ inputs.expected_sha256 }}
        run: |
          got=$(sha256sum "$RUNNER_TEMP/bytecode/$PROGRAM" | cut -c1-64)
          if [ -z "$SHA" ] || [ "$got" != "$SHA" ]; then
            echo "::error::The bytecode here ($got) is not what the build job made (${SHA:-nothing})."
            exit 1
          fi
          if [ "$BROADCAST" = "true" ] && [ "$got" != "$EXPECTED" ]; then
            echo "::error::Sending needs the expected bytecode; this is $got."
            exit 1
          fi
          echo "Bytecode $got."

      - name: Install Leo 4.4.6 (checksum pinned)
        run: |
          curl -fsSL "$LEO_SIGN_URL" -o leo.zip
          echo "$LEO_SIGN_SHA256  leo.zip" | sha256sum -c -
          unzip -q leo.zip -d "$RUNNER_TEMP/leo"
          install -m 0755 "$RUNNER_TEMP/leo/leo" "$HOME/leo"
          "$HOME/leo" --version

      - name: Check there is a key
        env:
          PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::No key. Add ADMIN_PRIVATE_KEY to the testnet-staging environment's secrets."
            exit 1
          fi
          addr=$("$HOME/leo" account import "$PRIVATE_KEY" 2>/dev/null | grep -o 'aleo1[a-z0-9]\{58\}' | head -1)
          echo "The deploy fee comes from ${addr:-an unknown account}."
          echo "Its public balance: $(curl -fsSL "$ENDPOINT/testnet/program/credits.aleo/mapping/account/$addr" || echo unknown)"

      - name: Deploy ${{ inputs.program }} from its bytecode
        env:
          PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY }}
          HEIGHTS: ${{ inputs.consensus_heights }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/.aleo"
          # Wait up to ~5 minutes for the transaction to land.
          flags=(--path "$RUNNER_TEMP/bytecode/$PROGRAM" --network testnet --endpoint "$ENDPOINT" --yes --max-wait 20 --blocks-to-check 100)
          if [ -n "$HEIGHTS" ]; then flags+=(--consensus-heights "$HEIGHTS"); fi
          if [ "$BROADCAST" = "true" ]; then
            flags+=(--broadcast)
            echo "Sending the deployment of $PROGRAM ($SHA)."
          else
            echo "Check only: building the deployment of $PROGRAM, nothing is sent."
          fi
          "$HOME/leo" deploy "${flags[@]}" 2>&1 | sed -E 's/APrivateKey1[0-9A-Za-z]+/<redacted>/g'

      - name: Show whether ${{ inputs.program }} is on testnet
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$ENDPOINT/testnet/program/$PROGRAM")
          echo "$PROGRAM on testnet: HTTP $code (200 = deployed)"
