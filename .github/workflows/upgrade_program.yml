name: upgrade-admin-program

# Upgrades one @admin program in place (same id, edition +1), from the
# GitHub app or website: Actions → upgrade-admin-program → Run workflow.
# Leave "broadcast" off first: it builds and checks without sending anything.
# The key comes from the testnet-staging environment and must belong to the
# programs' @admin address, or the run stops before building.

on:
  workflow_dispatch:
    inputs:
      program:
        description: "Program to upgrade"
        required: true
        type: choice
        options:
          - pnw_name_registrar_v5.aleo
          - employer_agreement_v4.aleo
      broadcast:
        description: "Send it (off = build and check only)"
        required: true
        type: boolean
        default: false
      endpoint:
        description: "Explorer API base (Leo appends /testnet/...)"
        required: true
        type: string
        default: "https://api.explorer.provable.com/v2"
      consensus_heights:
        description: "Testnet consensus activation heights V1..V22 (snarkVM 4.12.0); blank = Leo's own table"
        required: false
        type: string
        default: "0,2950000,4800000,6625000,6765000,7600000,8365000,9173000,9800000,10525000,11952000,12669000,14906000,15370000,16886000,17319000,18295000,18296000,18813000,19374000,20234000,20415000"
      leo_release:
        description: "Leo version from crates.io, or latest (built once, then cached)"
        required: true
        type: string
        default: "latest"

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    environment: testnet-staging
    concurrency:
      group: upgrade-admin-program
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ADMIN_ADDRESS: aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx
      ENDPOINT: ${{ inputs.endpoint }}
      PROGRAM: ${{ inputs.program }}
      BROADCAST: ${{ inputs.broadcast }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Two Leos. 4.0.0 compiles our sources (they use its syntax, and its output is the
      # bytecode checked against the deployed edition). The newer one, built from crates.io
      # because Leo no longer publishes binaries, signs and sends under today's consensus.
      - name: Pick Leo version
        id: leo-version
        env:
          LEO_RELEASE: ${{ inputs.leo_release }}
        run: |
          v="${LEO_RELEASE#v}"
          if [ -z "$v" ] || [ "$v" = "latest" ]; then
            v=$(curl -fsSL -A "pnw-mvp-ci" https://crates.io/api/v1/crates/leo-lang | jq -r .crate.max_stable_version)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Leo $v"
          echo "Its snarkVM: $(curl -fsSL -A "pnw-mvp-ci" "https://crates.io/api/v1/crates/leo-lang/$v/dependencies" | jq -r '.dependencies[] | select(.crate_id=="snarkvm") | .req')"
          echo "Newest snarkVM on crates.io: $(curl -fsSL -A "pnw-mvp-ci" https://crates.io/api/v1/crates/snarkvm | jq -r .crate.max_stable_version)"
          echo "Network block height now: $(curl -fsSL "$ENDPOINT/testnet/block/height/latest")"

      - name: Restore Leo ${{ steps.leo-version.outputs.version }}
        id: leo-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/cargo-leo
          key: leo-crates-${{ steps.leo-version.outputs.version }}-${{ runner.os }}

      - name: Build Leo ${{ steps.leo-version.outputs.version }} (first run per version, about 16 minutes)
        if: steps.leo-cache.outputs.cache-hit != 'true'
        env:
          LEO_VERSION: ${{ steps.leo-version.outputs.version }}
        run: cargo install leo-lang --locked --version "$LEO_VERSION" --root "$HOME/cargo-leo"

      - name: Save Leo ${{ steps.leo-version.outputs.version }}
        if: steps.leo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/cargo-leo
          key: leo-crates-${{ steps.leo-version.outputs.version }}-${{ runner.os }}

      - name: Install both Leos
        run: |
          echo "$HOME/cargo-leo/bin" >> "$GITHUB_PATH"
          "$HOME/cargo-leo/bin/leo" --version
          curl -fsSL "https://github.com/ProvableHQ/leo/releases/download/v4.0.0/leo-master-x86_64-unknown-linux-gnu.zip" -o leo400.zip
          unzip -q leo400.zip -d /tmp/leo400
          install -m 0755 /tmp/leo400/leo "$HOME/leo400"
          "$HOME/leo400" --version

      - name: Check the key is the admin key
        env:
          PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY || secrets.ALEO_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::No key. Add ADMIN_PRIVATE_KEY to the testnet-staging environment's secrets."
            exit 1
          fi
          addr=$(leo account import "$PRIVATE_KEY" --disable-update-check 2>/dev/null | grep -o 'aleo1[a-z0-9]\{58\}' | head -1)
          if [ "$addr" != "$ADMIN_ADDRESS" ]; then
            echo "::error::That key belongs to ${addr:-an unknown account}, not the admin ${ADMIN_ADDRESS}. Put the admin key in ADMIN_PRIVATE_KEY."
            exit 1
          fi
          echo "Key matches the admin address."

      - name: Compile ${{ inputs.program }} with Leo 4.0.0
        run: |
          mkdir -p "$HOME/.aleo"   # Leo's program registry; it won't create it itself
          # Leo 4.4 reads any path ending in .aleo as a bytecode file; build from a copy without the suffix.
          pkg="$RUNNER_TEMP/pkg/${PROGRAM%.aleo}"
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/bytecode"
          cp -r "src/layer1/$PROGRAM" "$pkg"
          (cd "$pkg" && "$HOME/leo400" build --disable-update-check --network testnet --endpoint "$ENDPOINT")
          cp "$pkg/build/main.aleo" "$RUNNER_TEMP/bytecode/$PROGRAM"
          echo "Functions in the compiled program:"
          grep -E '^(function|closure|constructor)' "$RUNNER_TEMP/bytecode/$PROGRAM"
          sha256sum "$RUNNER_TEMP/bytecode/$PROGRAM"

      - name: Upgrade ${{ inputs.program }} from its bytecode
        env:
          PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY || secrets.ALEO_PRIVATE_KEY }}
          HEIGHTS: ${{ inputs.consensus_heights }}
        run: |
          set -o pipefail
          leo upgrade --help | sed -n '1,12p'
          flags=(--path "$RUNNER_TEMP/bytecode/$PROGRAM" --network testnet --endpoint "$ENDPOINT" --yes --disable-update-check)
          # Leo built on snarkVM 4.11 has V21/V22 as unscheduled placeholders; testnet
          # activated them at 20,234,000 and 20,415,000 (snarkVM 4.12.0).
          if [ -n "$HEIGHTS" ]; then flags+=(--consensus-heights "$HEIGHTS"); fi
          if [ "$BROADCAST" = "true" ]; then
            flags+=(--broadcast)
            echo "Sending the upgrade of $PROGRAM."
          else
            echo "Check only: building the upgrade of $PROGRAM, nothing is sent."
          fi
          leo upgrade "${flags[@]}" 2>&1 | sed -E 's/APrivateKey1[0-9A-Za-z]+/<redacted>/g'
