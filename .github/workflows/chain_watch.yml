name: chain-watch

# Every day, and by hand: reads each of our programs from the public explorer and compares its
# edition and its text with config/testnet.manifest.json (scripts/check_chain.py). An @admin
# program can be upgraded in place with the admin key, and a wallet proves against the newest
# edition without saying so; this run is how an upgrade nobody recorded gets noticed. A failed
# run emails the repository's owner. No secret is used.

on:
  schedule:
    - cron: "23 13 * * *" # 13:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain-watch
  cancel-in-progress: true

jobs:
  watch:
    name: The chain is what the manifest records
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Compare every program's edition and text with the manifest
        run: python3 -I scripts/check_chain.py
