name: Deploy PNW Router to Aleo Testnet (Plan Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04

    env:
      # Leo's release pairs it with snarkOS 4.12.0 (its leo-release.toml). Both moved from ProvableHQ
      # to aleo-labs-protocol in late October 2026; the checksums are of the release zips.
      LEO_VERSION: 4.4.6
      SNARKOS_VERSION: v4.12.0
      LEO_URL: https://github.com/aleo-labs-protocol/leo/releases/download/leo-lang-v4.4.6/leo-lang-v4.4.6-x86_64-unknown-linux-gnu.zip
      SNARKOS_URL: https://github.com/aleo-labs-protocol/snarkOS/releases/download/v4.12.0/aleo-v4.12.0-x86_64-unknown-linux-gnu.zip
      LEO_SHA256: "7888ee2f03554590d9ac9d61ba02a8d0833e37b5b24666f79a735317a0ad8902"
      SNARKOS_SHA256: "31818f467c1b6bef6376c932c72fc47209f78a3a93662057f9c77cdef7913545"
      STRICT_VERSION_CHECK: "false"

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4.2.2

      - name: 🔑 No keys or tokens in the tree
        run: python3 -I scripts/check_secrets.py

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: 🛠️ Install Leo CLI (pinned, checksum verified)
        run: |
          curl -fsSL "$LEO_URL" -o leo.zip
          echo "$LEO_SHA256  leo.zip" | sha256sum -c -
          unzip leo.zip -d /tmp
          sudo mv /tmp/leo /usr/local/bin/leo
          sudo chmod +x /usr/local/bin/leo
          leo --version
      - name: ⚙️ Install snarkOS (pinned, checksum verified)
        run: |
          curl -fsSL "$SNARKOS_URL" -o snarkos.zip
          echo "$SNARKOS_SHA256  snarkos.zip" | sha256sum -c -
          unzip snarkos.zip -d /tmp
          sudo mv /tmp/snarkos /usr/local/bin/snarkos
          sudo chmod +x /usr/local/bin/snarkos
          snarkos --version

      - name: ✅ Verify pinned CLI versions
        run: scripts/verify_provable_cli.sh

      - name: 📋 Validate testnet manifest schema
        run: python3 scripts/validate_testnet_manifest.py config/testnet.manifest.json

      - name: 🛡️ Enforce Layer 1 public-state leakage guard
        run: python3 scripts/check_layer1_public_leakage_guards.py

      - name: 🔗 Links between the documents point at something
        run: python3 -I scripts/check_links.py
      - name: 🗄️ Archived programs unchanged and listed
        run: python3 -I scripts/check_archive.py

      - name: 🧱 Layer 2 moves no funds
        run: python3 -I scripts/check_layer2_moves_no_funds.py

      - name: 🗺️ Check the public-state map lists every mapping
        run: python3 -I scripts/check_public_state.py

      - name: 🛡️ Enforce execute negative-path guards
        run: scripts/check_phase4_negative_path_guards.sh

      - name: 🔁 Does Leo 4.4.6 rebuild the deployed programs byte for byte? (report only)
        # They were compiled with Leo 4.0.0. upgrade-admin-program keeps compiling with 4.0.0 until
        # this says "same" for the upgradable ones, since an upgrade may only append to the deployed
        # bytecode. Only the programs that build without imports; never fails the gate.
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.aleo"
          for prog in hewn_letters_v2 employer_agreement_v5 pnw_name_registry_v2 paystub_receipts payroll_audit_log employer_license_registry; do
            pkg="$RUNNER_TEMP/rebuild/$prog"
            mkdir -p "$RUNNER_TEMP/rebuild"
            cp -r "src/layer1/$prog.aleo" "$pkg"
            if ! (cd "$pkg" && leo build --disable-update-check >/dev/null 2>&1); then
              echo "$prog: does not build with $(leo --version | head -1)"; continue
            fi
            if ! curl -fsSL "https://api.explorer.provable.com/v2/testnet/program/$prog.aleo" | python3 -c 'import json,sys; sys.stdout.write(json.load(sys.stdin))' > "$pkg/live.aleo"; then
              echo "$prog: could not read the live program"; continue
            fi
            if cmp -s "$pkg/build/main.aleo" "$pkg/live.aleo"; then
              echo "$prog: same as deployed"
            else
              echo "$prog: differs from deployed ($(diff "$pkg/build/main.aleo" "$pkg/live.aleo" | grep -c '^[<>]') lines)"
            fi
          done

      - name: 🧪 Leo tests for hewn_letters_v2 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Leo reads a path ending in .aleo as bytecode; test from a copy without the suffix.
          pkg="$RUNNER_TEMP/hewn_letters_v2"
          cp -r src/layer1/hewn_letters_v2.aleo "$pkg"
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-v2.log"
          grep -q "12 / 12 tests passed" "$RUNNER_TEMP/leo-test-v2.log"

      - name: 🧪 Leo tests for hewn_jobs_v1 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Its program.json depends on the local registry stub at ../../stubs; copy both so the path holds.
          pkg="$RUNNER_TEMP/jobs/pkg/hewn_jobs_v1"
          mkdir -p "$RUNNER_TEMP/jobs/pkg"
          cp -r src/stubs "$RUNNER_TEMP/jobs/stubs"
          cp -r src/layer1/hewn_jobs_v1.aleo "$pkg"
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-jobs.log"
          grep -q "31 / 31 tests passed" "$RUNNER_TEMP/leo-test-jobs.log"

      - name: 🧪 Leo tests for employer_agreement_v5 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # No imports, so no stubs; test from a copy without the .aleo suffix.
          pkg="$RUNNER_TEMP/employer_agreement_v5"
          cp -r src/layer1/employer_agreement_v5.aleo "$pkg"
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-agreement-v5.log"
          grep -q "22 / 22 tests passed" "$RUNNER_TEMP/leo-test-agreement-v5.log"

      - name: 🧪 Leo tests for hewn_cards_v1 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Its program.json depends on the local registry stub at ../../stubs; copy both so the path holds.
          pkg="$RUNNER_TEMP/cards/pkg/hewn_cards_v1"
          mkdir -p "$RUNNER_TEMP/cards/pkg"
          cp -r src/stubs "$RUNNER_TEMP/cards/stubs"
          cp -r src/layer1/hewn_cards_v1.aleo "$pkg"
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-cards.log"
          grep -q "22 / 22 tests passed" "$RUNNER_TEMP/leo-test-cards.log"

      - name: 🧪 Leo tests for hewn_credentials_v1 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Its program.json depends on the local employer_agreement_v5 stub at ../../stubs; copy both so the path holds.
          pkg="$RUNNER_TEMP/credentials/pkg/hewn_credentials_v1"
          mkdir -p "$RUNNER_TEMP/credentials/pkg"
          cp -r src/stubs "$RUNNER_TEMP/credentials/stubs"
          cp -r src/layer1/hewn_credentials_v1.aleo "$pkg"
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-credentials.log"
          grep -q "28 / 28 tests passed" "$RUNNER_TEMP/leo-test-credentials.log"

      - name: 🧪 Leo tests for pnw_name_registry_v2 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Tests only; the deployed program is never edited. The copy under test differs on two
          # marked lines so the tests can run offline: ADMIN is the test program's own address (its
          # writes are gated on the caller being the registrar or ADMIN, and a program's caller inside
          # a test is the test program), and the constructor is @noupgrade (the local test ledger
          # refuses to deploy an @admin program for a deployer who isn't the admin). See the README.
          pkg="$RUNNER_TEMP/registry/pkg/pnw_name_registry_v2"
          mkdir -p "$RUNNER_TEMP/registry/pkg"
          cp -r src/layer1/pnw_name_registry_v2.aleo "$pkg"
          cd "$pkg"
          sed -i 's/const ADMIN: address = aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx;/const ADMIN: address = aleo1lmfaqae9nx2nxxm4f4fzv9cztv3fauhtvd8hwvg4pugjefpa0g9q9ctnfe;/' src/main.leo
          sed -i 's/^    @admin(address = "aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx")$/    @noupgrade/' src/main.leo
          test "$(grep -c 'aleo1lmfaqae9nx2nxxm4f4fzv9cztv3fauhtvd8hwvg4pugjefpa0g9q9ctnfe' src/main.leo)" = "1"
          grep -q '^    @noupgrade$' src/main.leo
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-registry.log"
          grep -q "30 / 30 tests passed" "$RUNNER_TEMP/leo-test-registry.log"

      - name: 🧪 Leo tests for pnw_name_registrar_v5 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Tests only; the deployed program is never edited. Its three network dependencies become
          # local ones: the stablecoin and licence-registry stubs, and the real registry with ADMIN set
          # to the registrar's own program address (the registry gates writes on the caller being the
          # registrar or ADMIN, and the caller of a program the registrar calls is the registrar).
          # Both copies get @noupgrade for @admin (the local ledger refuses an @admin program whose
          # deployer isn't the admin). See the README.
          work="$RUNNER_TEMP/registrar"
          mkdir -p "$work/pkg" "$work/registry"
          cp -r src/stubs "$work/stubs"
          reg="$work/registry/pnw_name_registry_v2.aleo"
          cp -r src/layer1/pnw_name_registry_v2.aleo "$reg"
          rm -rf "$reg/tests"
          sed -i 's/const ADMIN: address = aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx;/const ADMIN: address = aleo182yu0apetjymwrw52tnx3wx9rc3kw3t6asvwesd3maa9ruz4fqrqw3hven;/' "$reg/src/main.leo"
          sed -i 's/^    @admin(address = "aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx")$/    @noupgrade/' "$reg/src/main.leo"
          test "$(grep -c 'aleo182yu0apetjymwrw52tnx3wx9rc3kw3t6asvwesd3maa9ruz4fqrqw3hven' "$reg/src/main.leo")" = "1"
          grep -q '^    @noupgrade$' "$reg/src/main.leo"
          pkg="$work/pkg/pnw_name_registrar_v5"
          cp -r src/layer1/pnw_name_registrar_v5.aleo "$pkg"
          sed -i 's/^    @admin(address = "aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx")$/    @noupgrade/' "$pkg/src/main.leo"
          grep -q '^    @noupgrade$' "$pkg/src/main.leo"
          cat > "$pkg/program.json" <<'JSON'
          {
            "program": "pnw_name_registrar_v5.aleo",
            "version": "0.1.0",
            "description": "Test copy; the deployed dependencies are in src/layer1/pnw_name_registrar_v5.aleo/program.json.",
            "license": "AGPL-3.0-only",
            "dependencies": [
              { "name": "employer_license_registry.aleo", "location": "local", "path": "../../stubs/employer_license_registry.aleo" },
              { "name": "test_usdcx_stablecoin.aleo", "location": "local", "path": "../../stubs/test_usdcx_stablecoin.aleo" },
              { "name": "pnw_name_registry_v2.aleo", "location": "local", "path": "../../registry/pnw_name_registry_v2.aleo" }
            ]
          }
          JSON
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-registrar.log"
          grep -q "24 / 24 tests passed" "$RUNNER_TEMP/leo-test-registrar.log"

      - name: 🧪 Leo tests for pnw_worker_profiles_v2 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Tests only; the deployed program is never edited. The copy gets @noupgrade for @admin (the
          # local ledger refuses an @admin program whose deployer isn't the admin) and its registry
          # dependency pointed at the stub, whose assert_is_owner is the deployed one and whose
          # test-only register_test_name seeds the owner. See the README.
          work="$RUNNER_TEMP/profiles"
          mkdir -p "$work/pkg"
          cp -r src/stubs "$work/stubs"
          pkg="$work/pkg/pnw_worker_profiles_v2"
          cp -r src/layer1/pnw_worker_profiles_v2.aleo "$pkg"
          sed -i 's/^    @admin(address = "aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx") constructor() {}$/    @noupgrade constructor() {}/' "$pkg/src/main.leo"
          grep -q '^    @noupgrade constructor() {}$' "$pkg/src/main.leo"
          sed -i 's#"path": "../pnw_name_registry_v2.aleo"#"path": "../../stubs/pnw_name_registry_v2.aleo"#' "$pkg/program.json"
          grep -q 'stubs/pnw_name_registry_v2.aleo' "$pkg/program.json"
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-profiles.log"
          grep -q "19 / 19 tests passed" "$RUNNER_TEMP/leo-test-profiles.log"

      - name: 🧪 Leo tests for employer_agreement_v4 (negative cases included)
        run: |
          mkdir -p "$HOME/.aleo"
          # Tests only; the deployed program is never edited. The copy gets @noupgrade for @admin (the
          # local ledger refuses an @admin program whose deployer isn't the admin) and its two network
          # dependencies pointed at the stubs (assert_is_owner and assert_verified as deployed, with the
          # test-only register_test_name and set_test_verified to seed them). See the README.
          work="$RUNNER_TEMP/agreement4"
          mkdir -p "$work/pkg"
          cp -r src/stubs "$work/stubs"
          pkg="$work/pkg/employer_agreement_v4"
          cp -r src/layer1/employer_agreement_v4.aleo "$pkg"
          sed -i 's/^    @admin(address = "aleo1a2qje865a7ccrrwg37z6e36uyjtqlm5vdj8yzlrhypvg60xhncqqlev4dx")$/    @noupgrade/' "$pkg/src/main.leo"
          grep -q '^    @noupgrade$' "$pkg/src/main.leo"
          cat > "$pkg/program.json" <<'JSON'
          {
            "program": "employer_agreement_v4.aleo",
            "version": "0.1.0",
            "description": "Test copy; the deployed dependencies are in src/layer1/employer_agreement_v4.aleo/program.json.",
            "license": "AGPL-3.0-only",
            "dependencies": [
              { "name": "pnw_name_registry_v2.aleo", "location": "local", "path": "../../stubs/pnw_name_registry_v2.aleo" },
              { "name": "employer_license_registry.aleo", "location": "local", "path": "../../stubs/employer_license_registry.aleo" }
            ]
          }
          JSON
          cd "$pkg"
          leo test --disable-update-check | tee "$RUNNER_TEMP/leo-test-agreement4.log"
          grep -q "31 / 31 tests passed" "$RUNNER_TEMP/leo-test-agreement4.log"
